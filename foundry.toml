[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
via_ir = true          # nested mapping in Budget struct triggers stack-too-deep without this
                        # (same class of bug hit AgoraFxV2's Market struct — see plan §Phase1 note)
optimizer = true
optimizer_runs = 200
solc_version = "0.8.20"

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://api.testnet.arcscan.app/api" }

# /etc/nginx/sites-available/ceedebooks-site  (symlink into sites-enabled), then: sudo certbot --nginx -d ceedebooks.xyz
# Static proof page. Files live in /var/www/ceedebooks (copy of the repo's site/ directory).
server {
    listen 80;
    server_name ceedebooks.xyz;

    root /var/www/ceedebooks;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.ceedebooks.xyz https://rpc.testnet.arc.network https://rpc.testnet.arc.io https://rpc.blockdaemon.testnet.arc.network https://rpc.drpc.testnet.arc.network; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

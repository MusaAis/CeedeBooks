# /etc/nginx/sites-available/ceedebooks-portal  (symlink into sites-enabled), then: sudo certbot --nginx -d portal.ceedebooks.xyz
# Static vendor portal. Files live in /var/www/ceedebooks-portal (copy of the repo's portal/ directory, tests excluded).
# The real protection is on the API: a vendor session is a wallet signature, and every vendor route returns only that vendor's own data.
server {
    listen 80;
    server_name portal.ceedebooks.xyz;

    root /var/www/ceedebooks-portal;
    index index.html;

    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.ceedebooks.xyz; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

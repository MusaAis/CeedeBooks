# /etc/nginx/sites-available/ceedebooks-admin  (symlink into sites-enabled), then: sudo certbot --nginx -d admin.ceedebooks.xyz
# Static admin app. Files live in /var/www/ceedebooks-admin (copy of the repo's admin/ directory, tests excluded).
# The real protection is on the API: every /admin route needs a session signed by the contract's approver wallet.
server {
    listen 80;
    server_name admin.ceedebooks.xyz;

    root /var/www/ceedebooks-admin;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.ceedebooks.xyz; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

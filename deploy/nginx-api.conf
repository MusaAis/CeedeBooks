# /etc/nginx/sites-available/ceedebooks-api  (symlink into sites-enabled)
# Start with this plain-HTTP block; `certbot --nginx -d api.ceedebooks.xyz` then adds the HTTPS server and the redirect.
server {
    listen 80;
    server_name api.ceedebooks.xyz;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its address; the app rate-limits on this value (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An invoice that pays waits for two on-chain confirmations before the API answers.
        proxy_read_timeout 180s;
    }
}
